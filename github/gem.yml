- name: Build unsigned archive
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

          xcodebuild archive \
            -project "${{ steps.locate.outputs.project }}" \
            -scheme WebBrowse \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/WebBrowse.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
