name: Build and Export IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project "WebBrowse-LiveContainer-4.1/WebBrowse.xcodeproj" \
            -scheme "WebBrowse" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/WebBrowse.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            
      - name: Package Unsigned IPA
        run: |
          mkdir -p "$PWD/build/Payload"
          cp -r "$PWD/build/WebBrowse.xcarchive/Products/Applications/WebBrowse.app" "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -r WebBrowse.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebBrowse-Unsigned-IPA
          path: build/WebBrowse.ipa
