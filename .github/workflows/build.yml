name: Build WebBrowse IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Find Main WebBrowse Xcode Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="./WebBrowse-Ultimate-3.6-40-Bug-Fix-Full-Audit/wb35/WebBrowse.xcodeproj"

          if [ ! -d "$PROJECT" ]; then
            echo "ERROR: Main WebBrowse.xcodeproj was not found."
            echo "Expected location:"
            echo "$PROJECT"
            exit 1
          fi

          echo "Found MAIN WebBrowse project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Verify WebBrowse scheme
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          echo "Checking project:"
          echo "$PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          xcodebuild clean \
            -project "$PROJECT" \
            -scheme WebBrowse \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          ARCHIVE="$RUNNER_TEMP/WebBrowse.xcarchive"

          echo "Building unsigned WebBrowse archive..."

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme WebBrowse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo ""
          echo "Archive created successfully:"
          ls -lah "$ARCHIVE/Products/Applications/"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/WebBrowse.xcarchive"
          OUTPUT="$RUNNER_TEMP/WebBrowse-Unsigned.ipa"

          APP="$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -name '*.app' \
            -type d \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: No .app was produced by the archive."
            exit 1
          fi

          echo "Found app:"
          echo "$APP"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          /usr/bin/zip -qry "$OUTPUT" Payload

          echo ""
          echo "IPA created successfully:"
          ls -lh "$OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebBrowse-Unsigned-IPA
          path: ${{ runner.temp }}/WebBrowse-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
