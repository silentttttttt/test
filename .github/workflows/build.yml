name: Build WebBrowse IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Locate WebBrowse Xcode Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching repository for Xcode projects"
          echo "========================================"

          ALL_PROJECTS=$(find "$GITHUB_WORKSPACE" \
            -type d \
            -name "*.xcodeproj" \
            -print)

          echo ""
          echo "All Xcode projects found:"
          echo "$ALL_PROJECTS"
          echo ""

          PROJECT=""

          while IFS= read -r candidate; do
            if [[ "$candidate" != *"WebBrowsePacketTunnel"* ]]; then
              PROJECT="$candidate"
              break
            fi
          done <<< "$ALL_PROJECTS"

          if [ -z "$PROJECT" ]; then
            echo ""
            echo "ERROR: No main WebBrowse Xcode project was found."
            echo ""
            echo "Repository structure:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 6 \
              -type d \
              -name "*.xcodeproj" \
              -print

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "MAIN PROJECT SELECTED:"
          echo "$PROJECT"
          echo "========================================"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Verify WebBrowse scheme
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          echo "Checking project:"
          echo "$PROJECT"
          echo ""

          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Clean WebBrowse
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          xcodebuild clean \
            -project "$PROJECT" \
            -scheme WebBrowse \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          ARCHIVE="$RUNNER_TEMP/WebBrowse.xcarchive"

          echo "Building WebBrowse..."
          echo ""

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme WebBrowse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo ""
          echo "Archive created:"
          ls -lah "$ARCHIVE/Products/Applications/"

      - name: Find WebBrowse.app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/WebBrowse.xcarchive"

          APP="$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "WebBrowse.app" \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: WebBrowse.app was not created."
            exit 1
          fi

          echo "WebBrowse.app found:"
          echo "$APP"

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app }}"
          OUTPUT="$RUNNER_TEMP/WebBrowse-Unsigned.ipa"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP" "$RUNNER_TEMP/Payload/WebBrowse.app"

          cd "$RUNNER_TEMP"

          /usr/bin/zip -qry "$OUTPUT" Payload

          echo ""
          echo "========================================"
          echo "IPA CREATED:"
          echo "$OUTPUT"
          echo "========================================"

          ls -lh "$OUTPUT"

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$RUNNER_TEMP/WebBrowse-Unsigned.ipa"

          test -f "$IPA"

          echo "IPA contents:"
          unzip -l "$IPA" | head -30

          echo ""
          echo "IPA size:"
          ls -lh "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebBrowse-Unsigned-IPA
          path: ${{ runner.temp }}/WebBrowse-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
