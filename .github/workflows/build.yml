name: Build and Export IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Temporary Keychain
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain

      - name: Import Certificate and Provisioning Profile
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          if [ -n "$CERTIFICATE_P12_BASE64" ]; then
            echo "$CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
            security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-keychain-partition-list -S "apple-tool:,apple:" -s -k "" build.keychain
          fi

          if [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning%20Profiles
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          fi

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project "WebBrowse-Ultimate-3.6-40-Bug-Fix-Full-Audit/wb35/WebBrowse.xcodeproj" \
            -scheme "WebBrowse" \
            -configuration Release \
            -archivePath "$PWD/build/WebBrowse.xcarchive"

      - name: Export IPA
        run: |
          cat << EOF > ExportOptions.plist
          {
            "method": "development",
            "compileBitcode": false,
            "signingStyle": "automatic",
            "stripSwiftSymbols": true,
            "destination": "export"
          }
          EOF

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/WebBrowse.xcarchive" \
            -exportPath "$PWD/build/ipa" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebBrowse-IPA
          path: build/ipa/*.ipa
