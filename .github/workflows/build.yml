name: Build WebBrowse IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      # ---------------------------------------
      # 1. Checkout repository
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # 2. Select Xcode
      # ---------------------------------------
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ---------------------------------------
      # 3. Show Xcode version
      # ---------------------------------------
      - name: Show Xcode version
        run: |
          xcodebuild -version

      # ---------------------------------------
      # 4. Find MAIN WebBrowse Xcode project
      #    Excludes the PacketTunnel project
      # ---------------------------------------
      - name: Find Main WebBrowse Xcode Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for WebBrowse Xcode projects..."
          echo ""

          PROJECTS=$(find . \
            -name 'WebBrowse.xcodeproj' \
            -type d \
            -not -path '*/WebBrowsePacketTunnel/*')

          echo "Projects found:"
          echo "$PROJECTS"

          PROJECT=$(echo "$PROJECTS" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo ""
            echo "ERROR: Main WebBrowse.xcodeproj was not found."
            echo ""
            echo "All Xcode projects in repository:"
            find . -name '*.xcodeproj' -type d
            exit 1
          fi

          echo ""
          echo "Using MAIN WebBrowse project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # ---------------------------------------
      # 5. Verify WebBrowse scheme
      # ---------------------------------------
      - name: Verify WebBrowse scheme
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          echo "Checking project:"
          echo "$PROJECT"
          echo ""

          xcodebuild \
            -project "$PROJECT" \
            -list

      # ---------------------------------------
      # 6. Clean build
      # ---------------------------------------
      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          echo "Cleaning WebBrowse..."

          xcodebuild clean \
            -project "$PROJECT" \
            -scheme WebBrowse \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # ---------------------------------------
      # 7. Build unsigned archive
      # ---------------------------------------
      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          ARCHIVE="$RUNNER_TEMP/WebBrowse.xcarchive"

          echo "Building unsigned WebBrowse archive..."
          echo ""

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme WebBrowse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo ""
          echo "Archive created successfully."
          echo ""
          echo "Applications inside archive:"
          ls -lah "$ARCHIVE/Products/Applications/"

      # ---------------------------------------
      # 8. Find WebBrowse.app
      # ---------------------------------------
      - name: Find WebBrowse app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/WebBrowse.xcarchive"

          APP="$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -name 'WebBrowse.app' \
            -type d \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: WebBrowse.app was not produced."
            echo ""
            echo "Contents of Products/Applications:"
            ls -lah "$ARCHIVE/Products/Applications/"
            exit 1
          fi

          echo "WebBrowse.app found:"
          echo "$APP"

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      # ---------------------------------------
      # 9. Package unsigned IPA
      # ---------------------------------------
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app }}"
          OUTPUT="$RUNNER_TEMP/WebBrowse-Unsigned.ipa"
          PAYLOAD="$RUNNER_TEMP/Payload"

          echo "Packaging WebBrowse.app into IPA..."

          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"

          cp -R "$APP" "$PAYLOAD/WebBrowse.app"

          cd "$RUNNER_TEMP"

          /usr/bin/zip -qry "$OUTPUT" Payload

          echo ""
          echo "IPA created successfully:"
          ls -lh "$OUTPUT"

      # ---------------------------------------
      # 10. Verify IPA
      # ---------------------------------------
      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$RUNNER_TEMP/WebBrowse-Unsigned.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA file does not exist."
            exit 1
          fi

          echo "IPA verification:"
          unzip -l "$IPA" | head -30

          echo ""
          echo "IPA size:"
          ls -lh "$IPA"

      # ---------------------------------------
      # 11. Upload IPA to GitHub Actions
      # ---------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebBrowse-Unsigned-IPA
          path: ${{ runner.temp }}/WebBrowse-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
