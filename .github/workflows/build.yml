name: Build WebBrowse IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Select Xcode
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 3. Show Xcode version
      - name: Show Xcode version
        run: |
          xcodebuild -version

      # 4. Locate the MAIN WebBrowse project
      - name: Locate Main WebBrowse Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for main WebBrowse project..."

          PROJECT=""

          # Preferred location
          if [ -d "./WebBrowse-Ultimate-3.6-40-Bug-Fix-Full-Audit/wb35/WebBrowse.xcodeproj" ]; then
            PROJECT="./WebBrowse-Ultimate-3.6-40-Bug-Fix-Full-Audit/wb35/WebBrowse.xcodeproj"
          fi

          # Fallback: search for WebBrowse.xcodeproj
          if [ -z "$PROJECT" ]; then
            while IFS= read -r candidate; do

              # Never use the Packet Tunnel project
              if [[ "$candidate" == *"WebBrowsePacketTunnel"* ]]; then
                continue
              fi

              # Make sure it contains an Xcode project file
              if [ -f "$candidate/project.pbxproj" ]; then
                PROJECT="$candidate"
                break
              fi

            done < <(find . -type d -name "WebBrowse.xcodeproj" -print)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Main WebBrowse.xcodeproj was not found."
            echo ""
            echo "Xcode projects found:"
            find . -type d -name "*.xcodeproj" -print || true
            exit 1
          fi

          echo ""
          echo "MAIN PROJECT FOUND:"
          echo "$PROJECT"
          echo ""

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # 5. Verify that Xcode can actually read the project
      - name: Verify WebBrowse Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          echo "Checking:"
          echo "$PROJECT"
          echo ""

          if [ ! -f "$PROJECT/project.pbxproj" ]; then
            echo "ERROR: project.pbxproj is missing."
            exit 1
          fi

          echo "project.pbxproj found."
          echo ""

          xcodebuild \
            -project "$PROJECT" \
            -list

      # 6. Clean
      - name: Clean WebBrowse
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          xcodebuild clean \
            -project "$PROJECT" \
            -scheme WebBrowse \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # 7. Build unsigned archive
      - name: Build Unsigned Archive
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="${{ steps.project.outputs.project }}"
          ARCHIVE="$RUNNER_TEMP/WebBrowse.xcarchive"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme WebBrowse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          echo ""
          echo "Archive created successfully."
          echo ""

          ls -la "$ARCHIVE/Products/Applications/"

      # 8. Find the compiled WebBrowse.app
      - name: Find WebBrowse App
        id: app
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$RUNNER_TEMP/WebBrowse.xcarchive"

          APP="$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 \
            -type d \
            -name "WebBrowse.app" \
            -print -quit)"

          if [ -z "$APP" ]; then
            echo "ERROR: WebBrowse.app was not produced."
            echo ""
            echo "Applications inside archive:"
            find "$ARCHIVE/Products/Applications" -maxdepth 1 -print || true
            exit 1
          fi

          echo "WebBrowse.app found:"
          echo "$APP"

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      # 9. Package into IPA
      - name: Package Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app }}"
          PAYLOAD="$RUNNER_TEMP/Payload"
          IPA="$RUNNER_TEMP/WebBrowse-Unsigned.ipa"

          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"

          cp -R "$APP" "$PAYLOAD/WebBrowse.app"

          cd "$RUNNER_TEMP"

          /usr/bin/zip -qry \
            "$IPA" \
            Payload

          echo ""
          echo "IPA created:"
          ls -lh "$IPA"

      # 10. Verify IPA
      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$RUNNER_TEMP/WebBrowse-Unsigned.ipa"

          if [ ! -f "$IPA" ]; then
            echo "ERROR: IPA file does not exist."
            exit 1
          fi

          echo "Checking IPA contents:"
          unzip -l "$IPA"

          echo ""
          echo "IPA verification complete."

      # 11. Upload IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebBrowse-Unsigned-IPA
          path: ${{ runner.temp }}/WebBrowse-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
